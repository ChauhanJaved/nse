<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="8" />

  <!-- Candlestick background elements -->
  <g opacity="0.35">
    <rect x="100" y="240" width="12" height="120" rx="3" fill="#10B981" />
    <line x1="106" y1="200" x2="106" y2="380" stroke="#10B981" stroke-width="4" />

    <rect x="180" y="180" width="12" height="150" rx="3" fill="#3B82F6" />
    <line x1="186" y1="140" x2="186" y2="360" stroke="#3B82F6" stroke-width="4" />

    <rect x="260" y="210" width="12" height="100" rx="3" fill="#10B981" />
    <line x1="266" y1="170" x2="266" y2="340" stroke="#10B981" stroke-width="4" />

    <rect x="340" y="130" width="12" height="180" rx="3" fill="#10B981" />
    <line x1="346" y1="90" x2="346" y2="340" stroke="#10B981" stroke-width="4" />
  </g>

  <!-- Growth Trendline with Glow -->
  <path d="M 80 340 L 170 280 L 250 310 L 390 140" fill="none" stroke="url(#lineGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Ascending Arrow head -->
  <path d="M 340 140 L 410 135 L 400 205 Z" fill="#34D399" filter="url(#glow)" />

  <!-- NSE Text Logo -->
  <text x="256" y="420" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="76" letter-spacing="4">NSE</text>
</svg>
